name: Relay-CICD


on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main

jobs:

  prerequisites:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      run: echo "Checking out code..."

    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup pnpm
      run: echo "Setting up pnpm..."

    - name: Setup pnpm
      uses: pnpm/action-setup@v4

    - name: Setup Node.js
      run: echo "Setting up Node.js..."

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'pnpm'

    - name: Install dependencies
      run: echo "Installing dependencies..."

    - name: Install dependencies
      run: pnpm install --frozen-lockfile


  api-test:
    runs-on: ubuntu-latest
    needs: prerequisites
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: relay_test
          POSTGRES_PASSWORD: relay_test
          POSTGRES_DB: relay_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      minio:
        image: minio/minio:RELEASE.2025-09-07T16-13-09Z
        env:
          MINIO_ROOT_USER: relay_test
          MINIO_ROOT_PASSWORD: relay_test
        ports:
          - "9000:9000"
        command: server /data
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
    - name: Checkout code
      run: echo "Checking out code..."

    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup pnpm
      run: echo "Setting up pnpm..."

    - name: Setup pnpm
      uses: pnpm/action-setup@v4

    - name: Setup Node.js
      run: echo "Setting up Node.js..."

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'pnpm'

    - name: Install dependencies
      run: echo "Installing dependencies..."

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Install ffmpeg
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    - name: Install Minio Client
      run: |
        curl -sL -O https://dl.min.io/client/mc/release/linux-amd64/mc
        chmod +x mc
        sudo mv mc /usr/local/bin/mc

    - name: Configure Minio Client
      run: |
        mc alias set local http://localhost:9000 relay_test relay_test
        mc mb --ignore-existing local/relay-test-bucket

    - name: Prisma Generate
      run: pnpm --filter @relay/api run prisma:generate
      env:
        DATABASE_URL: postgresql://relay_test:relay_test@localhost:5432/relay_test

    - name: Prisma Deployment
      run: pnpm --filter @relay/api run prisma:deploy
      env:
        DATABASE_URL: postgresql://relay_test:relay_test@localhost:5432/relay_test

    - name: Run tests
      run: pnpm --filter @relay/api run test
      env:
        DATABASE_URL: postgresql://relay_test:relay_test@localhost:5432/relay_test
        REDIS_URL: redis://localhost:6379
        MINIO_ENDPOINT: localhost
        MINIO_PORT: 9000
        MINIO_USE_SSL: "false"
        MINIO_ACCESS_KEY: relay_test
        MINIO_SECRET_KEY: relay_test
        MINIO_BUCKET_MEDIA: relay-test-bucket
        JWT_SECRET: test_jwt_secret
        JWT_REFRESH_SECRET: test_jwt_refresh_secret
        COOKIE_SECRET: test_cookie_secret

    - name: Generate Summary
      if: always()
      run: node .github/scripts/summarize-api-tests.mjs apps/api/test-results.xml

  web-test:
    runs-on: ubuntu-latest
    needs: prerequisites
    steps:
    - name: Checkout code
      run: echo "Checking out code..."

    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup pnpm
      run: echo "Setting up pnpm..."

    - name: Setup pnpm
      uses: pnpm/action-setup@v4

    - name: Setup Node.js
      run: echo "Setting up Node.js..."

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'pnpm'

    - name: Install dependencies
      run: echo "Installing dependencies..."

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Run tests
      run: pnpm --filter @relay/web run test

    - name: Generate Summary
      if: always()
      run: node .github/scripts/summarize-web-tests.mjs apps/web/vitest-results.json
